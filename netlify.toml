[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirigir el subdominio de Netlify al dominio principal (evita contenido duplicado en Google)
[[redirects]]
  from = "https://cosmovisiongt.netlify.app/*"
  to = "https://cosmovisiongt.com/:splat"
  status = 301
  force = true

# La grilla de canales está deshabilitada; enviar a los planes TV + Internet
[[redirects]]
  from = "/cable"
  to = "/planes"
  status = 301
  force = true

# URLs en español: redirigir las rutas anteriores en inglés (conserva links compartidos y posicionamiento)

[[redirects]]
  from = "/pricing"
  to = "/planes"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contacto"
  status = 301
  force = true

[[redirects]]
